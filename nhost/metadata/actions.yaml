actions:
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: "{{NHOST_FUNCTIONS_URL}}/triggerWorkflowRun"
      forward_client_headers: true
      headers:
        - name: x-hasura-admin-secret
          value_from_env: HASURA_GRAPHQL_ADMIN_SECRET
      request_transform:
        method: POST
        content_type: application/json
      timeout: 120
    permissions:
      - role: owner
      - role: editor
    comment: "Trigger a workflow run — requires owner or editor role"

  - name: approveStep
    definition:
      kind: synchronous
      handler: "{{NHOST_FUNCTIONS_URL}}/approveStep"
      forward_client_headers: true
      headers:
        - name: x-hasura-admin-secret
          value_from_env: HASURA_GRAPHQL_ADMIN_SECRET
      timeout: 120
    permissions:
      - role: owner
      - role: editor
    comment: "Approve a paused approval_gate step — requires owner or editor role, with secondary check in the handler"

  - name: webhookTrigger
    definition:
      kind: synchronous
      handler: "{{NHOST_FUNCTIONS_URL}}/webhookTrigger"
      forward_client_headers: false
      timeout: 30
    permissions:
      - role: public
    comment: "Inbound webhook to trigger a run from an external system — auth via api_key in payload"

custom_types:
  objects:
    - name: WorkflowRunResult
      fields:
        - name: workflow_run_id
          type: uuid!
        - name: status
          type: String!
        - name: message
          type: String!
    - name: ApproveStepResult
      fields:
        - name: step_run_id
          type: uuid!
        - name: status
          type: String!
        - name: message
          type: String!
    - name: WebhookTriggerResult
      fields:
        - name: workflow_run_id
          type: uuid!
        - name: status
          type: String!
        - name: message
          type: String!
  input_objects:
    - name: TriggerWorkflowRunInput
      fields:
        - name: workflow_id
          type: uuid!
    - name: ApproveStepInput
      fields:
        - name: step_run_id
          type: uuid!
    - name: WebhookTriggerInput
      fields:
        - name: workflow_id
          type: uuid!
        - name: api_key
          type: String!
        - name: payload
          type: jsonb
