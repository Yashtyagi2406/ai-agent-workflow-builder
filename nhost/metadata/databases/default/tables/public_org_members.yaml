table:
  name: org_members
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: user
    using:
      manual_configuration:
        remote_table:
          name: users
          schema: auth
        column_mapping:
          user_id: id
select_permissions:
  - role: owner
    permission:
      columns: "*"
      filter:
        org_id:
          _in:
            _select:
              column: org_id
              table:
                name: org_members
                schema: public
              where:
                user_id:
                  _eq: X-Hasura-User-Id
  - role: editor
    permission:
      columns:
        - id
        - org_id
        - user_id
        - role
        - created_at
      filter:
        org_id:
          _in:
            _select:
              column: org_id
              table:
                name: org_members
                schema: public
              where:
                user_id:
                  _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns:
        - id
        - org_id
        - user_id
        - role
        - created_at
      filter:
        org_id:
          _in:
            _select:
              column: org_id
              table:
                name: org_members
                schema: public
              where:
                user_id:
                  _eq: X-Hasura-User-Id
insert_permissions:
  - role: owner
    permission:
      columns:
        - org_id
        - user_id
        - role
      check:
        org_id:
          _in:
            _select:
              column: org_id
              table:
                name: org_members
                schema: public
              where:
                user_id:
                  _eq: X-Hasura-User-Id
                role:
                  _eq: owner
update_permissions:
  - role: owner
    permission:
      columns:
        - role
      filter:
        org_id:
          _in:
            _select:
              column: org_id
              table:
                name: org_members
                schema: public
              where:
                user_id:
                  _eq: X-Hasura-User-Id
                role:
                  _eq: owner
      check:
        org_id:
          _in:
            _select:
              column: org_id
              table:
                name: org_members
                schema: public
              where:
                user_id:
                  _eq: X-Hasura-User-Id
                role:
                  _eq: owner
delete_permissions:
  - role: owner
    permission:
      filter:
        org_id:
          _in:
            _select:
              column: org_id
              table:
                name: org_members
                schema: public
              where:
                user_id:
                  _eq: X-Hasura-User-Id
                role:
                  _eq: owner
