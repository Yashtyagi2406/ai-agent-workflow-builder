cron_triggers:
  - name: scheduled_workflow_runner
    webhook: "{{NHOST_FUNCTIONS_URL}}/scheduledRunner"
    schedule: "* * * * *"
    include_in_metadata: true
    payload: {}
    retry_conf:
      num_retries: 3
      timeout_seconds: 60
      tolerance_seconds: 21600
      retry_interval_seconds: 10
    comment: "Runs every minute — checks for due scheduled workflow triggers and starts runs"
    headers:
      - name: x-hasura-admin-secret
        value_from_env: HASURA_GRAPHQL_ADMIN_SECRET
